# Signal-Score: Gewichte und Schwellen
#
# Nur nach Auswertung von Journal bzw. Backtest ändern – und die Änderung
# im Commit begründen.
#
# Ausbaustufe: Bewertung (B), Kurstreiber (K) und Erwartungen (E) folgen mit
# fundamentals und der Websuche und sind bis dahin "nicht bewertet".

# Gewicht je Bereich (jeder Bereich hat 0–10 Punkte).
# Gesamtscore = Σ Gewicht · Punkte, Maximum = Σ Gewicht · 10.
# Gewicht 0: Bereich wird berechnet und im Bericht gezeigt, zählt aber nicht.
gewichte: {T: 1, M: 0, R: 0, B: 1, K: 1, E: 1}
gewichte_grund: >-
  Backtest 20.11.2026 (2017–2026): Risiko-Punkte bevorzugten Aktien, die
  danach zurücklagen (R >= 8: −1,9 Pp. nach 60 Tagen, t −4,7); Muster ohne
  belastbaren Vorsprung (M > 0: −0,6 Pp., t −2,1). Deshalb vorerst Gewicht 0.
  B, K, E: Gewicht 1 wie in CLAUDE.md vorgesehen – mangels historischer
  Fundamentaldaten nicht im Backtest prüfbar; Prüfstein ist das Journal.

# Einstufung als Anteil vom Maximum – entspricht 42 und 24 von 60 (CLAUDE.md).
klassen: {stark_ab_anteil: 0.7, gemischt_ab_anteil: 0.4}

# Reihenfolge bei gleichem Gesamtscore (absteigend): erst Technik, dann
# relative Stärke über 3 Monate (Teil der Technik). Risiko ist bewusst kein
# Kriterium mehr (siehe gewichte_grund).
sortierung: [gesamt, T, rs_3m_pp]

# --- Technik (T): Trend, Lage zu den Linien, relative Stärke -------------
# Punkte werden addiert und auf 0–10 begrenzt.
technik:
  kurs_ueber_sma200: 2
  kurs_ueber_sma50: 1
  sma50_ueber_sma200: 1
  sma200_steigend: 1           # Steigung der 200-Tage-Linie über 20 Tage > 0
  golden_cross_frisch: 1
  death_cross_frisch: -1
  rs_3m_positiv: 1             # besser als der Index über 3 Monate
  rs_12m_positiv: 1
  ruecksetzer_langfristig: 2   # RSI < rsi_ruecksetzer UND Kurs über 200-Tage-Linie
                               # (ersetzt "RSI < 30 im Aufwärtstrend": kam 2017–2026 nie vor)
  ueberkauft: -1               # RSI > ueberkauft: Rückschlaggefahr
  nahe_52w_hoch_im_trend: 1    # Abstand zum Hoch <= nahe_hoch_pct im Aufwärtstrend
  rsi_ueberkauft: 70
  rsi_ueberverkauft: 30
  rsi_ruecksetzer: 40
  nahe_hoch_pct: 5

# --- Muster (M): nur bullische Muster bringen Punkte ----------------------
# Wert = bestes bullisches Muster, danach Abzug für aktive bärische Muster.
# Bestätigt, aber Kurs wieder unter der Ausbruchsmarke (Rücklauf): zählt wie "in Bildung".
muster:
  bullisch:
    bestätigt:   {hoch: 9, mittel: 7, niedrig: 4}
    in Bildung:  {hoch: 5, mittel: 4, niedrig: 2}
    gescheitert: {hoch: 0, mittel: 0, niedrig: 0}
  seitwaertsphase:             # Richtung offen: nur Beobachtung
    in Bildung:  {hoch: 3, mittel: 2, niedrig: 1}
  abzug_baerisch:
    bestätigt: 4
    in Bildung: 2

# --- Risiko (R): 10 = geringes Risiko --------------------------------------
# Nur aus Kursdaten. Binäre Ereignisse (Zahlen, Studien) und Verschuldung
# kommen erst mit fundamentals / Websuche dazu.
risiko:
  volatilitaet_60t:            # annualisiert in %; [Grenze, Punkte], erste passende zählt
    - [22, 4]
    - [28, 3]
    - [35, 2]
    - [45, 1]
  max_rueckgang_12m:           # größter Rückgang vom Hoch in %
    - [18, 2]
    - [30, 1]
  tagesspruenge_12m:           # Tage mit Bewegung > sprung_pct
    - [0, 2]
    - [3, 1]
  sprung_pct: 8
  stopp_abstand:               # Abstand zur Invalidierung bzw. Unterstützung in %
    - [6, 2]
    - [12, 1]

# --- Bewertung (B): Verhältnis Aktie / Vergleichswert ----------------------
# Kleiner = günstiger. [Grenze, Punkte], erste passende Zeile zählt. Max. 10.
bewertung:
  kgv_vs_branche:          # aktuelles KGV / Branchenmedian
    - [0.7, 4]
    - [0.9, 3]
    - [1.1, 2]
    - [1.3, 1]
  kgv_vs_historie:         # aktuelles KGV / eigener Median der letzten Geschäftsjahre
    - [0.8, 3]
    - [1.0, 2]
    - [1.2, 1]
  ev_ebitda_vs_branche:    # EV/EBITDA / Branchenmedian
    - [0.7, 3]
    - [0.9, 2]
    - [1.1, 1]
  min_vergleichswerte: 8   # Branchenmedian erst ab so vielen Aktien mit KGV
  min_jahre_historie: 3    # eigener KGV-Median erst ab so vielen Geschäftsjahren
  guenstig_bis: 0.9        # Fazit "günstig": alle verfügbaren KGV-Verhältnisse <= 0,9
  teuer_ab: 1.25           # Fazit "teuer": ein KGV-Verhältnis >= 1,25

# --- Erwartungen (E) ----------------------------------------------------------
erwartungen:
  kursziel_abstand_pct:    # Ø-Kursziel über dem Kurs in %; [Mindestwert, Punkte]
    - [25, 3]
    - [15, 2]
    - [5, 1]
  empfehlung:              # Ø-Empfehlung (1 = Kaufen … 5 = Verkaufen); [Höchstwert, Punkte]
    - [1.8, 2]
    - [2.3, 1]
  eps_trend_pct:           # Gewinnschätzung nächstes Jahr, Veränderung in 90 Tagen
    - [3.0, 3]
    - [0.5, 2]
    - [-0.5, 1]
  revisionen_mehr_hoch: 2  # 30 Tage: mehr Anhebungen als Senkungen
  revisionen_ausgeglichen: 1
  min_analysten: 3
  max_punkte_wenige_analysten: 3

# --- Kurstreiber (K): vergibt Claude nach der Websuche (/top-aktien) ---------
kurstreiber_regel:
  - "8–10: bestätigter Termin in den nächsten 8 Wochen mit klarem, noch nicht eingepreistem Anlass"
  - "5–7: bestätigter Termin in den nächsten 8 Wochen (z. B. Quartalszahlen), Erwartung offen"
  - "2–4: Termin nur geschätzt oder später als 8 Wochen"
  - "0–1: kein Termin gefunden"
  - "Binäre Ereignisse (Studien, Urteile, Zahlen) erhöhen zugleich das Risiko – im Bericht nennen"
